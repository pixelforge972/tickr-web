<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0E0F10">
<meta name="description" id="meta-description" content="A minimalist metronome — no install needed, works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg?v=0.2.1" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg?v=0.2.1">
<title>Tickr</title>
<style>
html,body{margin:0;background:#0E0F10}
body{margin:0}
a{color:#F5A524}a:hover{color:#FFC45E}
/* ===== Tokens: dark (default) ===== */
.tk{
  --bg:#0E0F10; --surface:#17191B; --surface-2:#212427; --surface-3:#2C3034; --line:#33383D;
  --text:#F3F2EE; --text-2:#B4B8BB; --text-3:#8A9094;
  --accent:#F5A524; --accent-ink:#F5A524; --accent-ring:#F5A524; --on-accent:#1B1305;
  --accent-soft:rgba(245,165,36,.16); --accent-line:rgba(245,165,36,.55);
  --led-off:#1E2124; --led-ring:#646B70; --led-on:#F3F2EE; --halo:rgba(243,242,238,.14);
  --flash:rgba(243,242,238,.045); --flash-accent:rgba(245,165,36,.11);
  --scrim:rgba(0,0,0,.6); --focus:#F3F2EE;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;
  --hit:48px; --step-h:56px; --action-h:88px;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-family:var(--font); color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
/* ===== Tokens: light ===== */
.tk.theme-light{
  --bg:#F5F4F0; --surface:#FFFFFF; --surface-2:#EDEBE6; --surface-3:#E1DED7; --line:#D3D0C8;
  --text:#141516; --text-2:#4A4F53; --text-3:#62676B;
  --accent:#E8950F; --accent-ink:#8F5200; --accent-ring:#8F5200; --on-accent:#1B1305;
  --accent-soft:rgba(232,149,15,.16); --accent-line:rgba(143,82,0,.5);
  --led-off:#E6E3DC; --led-ring:#7F8488; --led-on:#141516; --halo:rgba(20,21,22,.10);
  --flash:rgba(20,21,22,.04); --flash-accent:rgba(232,149,15,.14);
  --scrim:rgba(20,21,22,.35); --focus:#141516;
}
.tk *{box-sizing:border-box}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ===== Layout: one fluid grid, breakpoints via container queries ===== */
.mt{container:mt / size; position:relative; overflow:hidden; width:100%; height:100dvh}
.mt-inner{height:100%; width:100%; margin:0 auto; padding:var(--space-4); display:grid; gap:var(--space-4);
  grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"top" "rhythm" "display" "tempo" "actions"}
.top{grid-area:top; display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); min-height:var(--hit)}
.rhythm{grid-area:rhythm; display:flex; flex-direction:column; gap:var(--space-2)}
.tempo{grid-area:tempo; display:flex; flex-direction:column; gap:var(--space-2)}
.actions{grid-area:actions; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.7fr); gap:var(--space-3)}
.steps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--space-2)}

/* ===== Display ===== */
.display{grid-area:display; position:relative; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(12px,3.5cqh,36px); border-radius:var(--r-xl); background-color:transparent; transition:background-color 200ms ease-out}
.display.flash{background-color:var(--flash); transition-duration:0ms}
.display.flash-accent{background-color:var(--flash-accent); transition-duration:0ms}
.readout{display:flex; flex-direction:column; align-items:center; gap:4px}
.bpm-unit{font-size:13px; font-weight:600; letter-spacing:.18em; color:var(--text-3)}
.bpm{display:block; font-size:clamp(88px,min(36cqi,19cqh),240px); font-weight:600; line-height:.92; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; color:var(--text); transition:color 160ms}
.is-tapping .bpm{color:var(--accent-ink)}
.tempo-name{font-size:18px; font-weight:500; color:var(--text-2); letter-spacing:.01em}

/* ===== Beat indicator ===== */
.leds{--led:clamp(18px,7.2cqi,34px); display:flex; align-items:center; justify-content:center; gap:clamp(8px,3cqi,18px)}
.beat{display:flex; flex-direction:column; align-items:center; gap:10px}
.beat.group-start{margin-left:clamp(4px,2cqi,14px)}
.led{display:block; width:var(--led); height:var(--led); border-radius:50%; background:var(--led-off);
  box-shadow:inset 0 0 0 2px var(--led-ring); transition:background-color 140ms ease-out, box-shadow 220ms ease-out}
.led-accent{width:calc(var(--led) * 1.3); height:calc(var(--led) * 1.3); box-shadow:inset 0 0 0 2.5px var(--accent-ring)}
.led-sec{box-shadow:inset 0 0 0 2px var(--text-2)}
.led.on{background:var(--led-on); box-shadow:inset 0 0 0 2px var(--led-on), 0 0 0 7px var(--halo); transition-duration:0ms}
.led-accent.on{background:var(--accent); box-shadow:inset 0 0 0 2.5px var(--accent-ring), 0 0 0 9px var(--accent-soft), 0 0 28px 4px var(--accent-soft)}
.pips{display:flex; gap:4px; height:6px}
.pip{width:6px; height:6px; border-radius:50%; background:var(--led-ring); opacity:.55}
.pip.on{background:var(--text); opacity:1}

/* ===== Buttons ===== */
.btn{-webkit-appearance:none; appearance:none; border:0; margin:0; padding:0; font:inherit; color:var(--text); background:var(--surface-2);
  cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:background-color 120ms, transform 90ms, filter 90ms}
.btn:active,.btn.is-pressed{background:var(--surface-3); transform:scale(.97)}
.btn:disabled,.btn.is-disabled{cursor:not-allowed; color:var(--text-3); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); transform:none}
.btn:focus-visible,.is-focus{outline:3px solid var(--focus); outline-offset:3px}
.btn-step{min-height:var(--step-h); border-radius:var(--r-md); font-size:20px; font-weight:600; font-variant-numeric:tabular-nums}
.btn-primary{display:flex; align-items:center; justify-content:center; gap:12px; min-height:var(--action-h); border-radius:var(--r-xl);
  background:var(--accent); color:var(--on-accent); font-size:22px; font-weight:700; letter-spacing:.01em}
.btn-primary:active,.btn-primary.is-pressed{background:var(--accent); filter:brightness(.88); transform:scale(.98)}
.btn-primary.is-active{background:var(--surface-2); color:var(--text); box-shadow:inset 0 0 0 2px var(--line)}
.btn-primary.is-active svg{color:var(--accent-ink)}
.btn-primary.is-active:active,.btn-primary.is-active.is-pressed{background:var(--surface-3); filter:none}
.btn-tap{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:var(--action-h);
  border-radius:var(--r-xl); box-shadow:inset 0 0 0 1px var(--line)}
.tap-label{font-size:20px; font-weight:700}
.tap-cap{font-size:12px; font-weight:500; color:var(--text-2)}
.btn-tap.is-active{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent-line); color:var(--accent-ink)}
.btn-tap.is-active .tap-cap{color:var(--accent-ink)}
.icon-btn{display:inline-flex; align-items:center; justify-content:center; width:var(--hit); height:var(--hit); border-radius:var(--r-full); background:transparent; color:var(--text-2)}
.icon-btn:active,.icon-btn.is-pressed{background:var(--surface-2); color:var(--text)}

/* ===== Segments ===== */
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:4px; padding:4px; background:var(--surface);
  border-radius:var(--r-md); box-shadow:inset 0 0 0 1px var(--line)}
.seg-btn{min-height:var(--hit); border-radius:var(--r-sm); background:transparent; color:var(--text-2); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
.seg-mode{grid-auto-columns:max-content}
.seg-mode .seg-btn{padding:0 var(--space-4)}
.seg-btn:active,.seg-btn.is-pressed{background:var(--surface-2); transform:none}
.seg-btn[aria-pressed="true"],.seg-btn.is-selected{background:var(--accent-soft); color:var(--accent-ink); box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.seg-btn:disabled{background:transparent; box-shadow:none; opacity:.5}
.seg-sub .seg-btn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; min-height:56px}
.sub-pips{display:flex; gap:4px}
.sub-pip{width:6px; height:6px; border-radius:50%; background:currentColor}
.sub-label{font-size:13px; font-weight:600}

/* ===== Slider ===== */
.range{-webkit-appearance:none; appearance:none; display:block; width:100%; height:var(--hit); margin:0; background:transparent; cursor:pointer; --fill:50%}
.range::-webkit-slider-runnable-track{height:6px; border-radius:3px; background:linear-gradient(to right, var(--accent) 0 var(--fill), var(--line) var(--fill) 100%)}
.range::-moz-range-track{height:6px; border-radius:3px; background:var(--line)}
.range::-moz-range-progress{height:6px; border-radius:3px; background:var(--accent)}
.range::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; margin-top:-11px; border-radius:50%; background:var(--text); box-shadow:0 0 0 4px var(--thumb-gap, var(--bg))}
.range::-moz-range-thumb{width:28px; height:28px; border:0; border-radius:50%; background:var(--text); box-shadow:0 0 0 4px var(--thumb-gap, var(--bg))}
.range:focus-visible,.range.is-focus{outline:none}
.range:focus-visible::-webkit-slider-thumb,.range.is-focus::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--thumb-gap, var(--bg)), 0 0 0 7px var(--focus)}
.range:disabled{cursor:not-allowed; opacity:.45}

/* ===== Switch ===== */
.switch-row{display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; min-height:64px; padding:10px 14px 10px 16px;
  border-radius:var(--r-md); text-align:left}
.switch-row:active,.switch-row.is-pressed{transform:none}
.sw-text{display:flex; flex-direction:column; gap:3px; min-width:0}
.sw-title{font-size:16px; font-weight:600}
.sw-cap{font-size:13px; line-height:1.35; color:var(--text-2)}
.switch{flex:none; position:relative; width:52px; height:32px; border-radius:16px; background:var(--surface); box-shadow:inset 0 0 0 2px var(--led-ring); transition:background-color 160ms}
.knob{position:absolute; top:4px; left:4px; width:24px; height:24px; border-radius:50%; background:var(--text-2); transition:transform 160ms, background-color 160ms}
.switch-row[aria-checked="true"] .switch{background:var(--accent); box-shadow:none}
.switch-row[aria-checked="true"] .knob{transform:translateX(20px); background:var(--on-accent)}

/* ===== Mute hint ===== */
.hint{position:absolute; top:0; left:0; right:0; margin:0 auto; width:max-content; max-width:100%; z-index:2; display:flex; align-items:center; gap:10px;
  padding:0 0 0 14px; min-height:var(--hit); background:var(--surface-2); color:var(--text); border-radius:var(--r-lg); box-shadow:inset 0 0 0 1px var(--line); font-size:14px; line-height:1.3}
.hint > svg{flex:none; color:var(--accent-ink)}
.hint .icon-btn{flex:none}
.hint[hidden]{display:none}
.mt-inner[hidden],.tn-inner[hidden]{display:none}
/* The HTML `hidden` attribute doesn't hide inline <svg> elements in every
   browser (their own default stylesheet wins over the generic [hidden] rule) —
   force it everywhere `hidden` is used to toggle an icon. */
svg[hidden]{display:none}

/* ===== Tuner: same grid skeleton pattern as the metronome ===== */
.tn-inner{height:100%; width:100%; margin:0 auto; padding:var(--space-4); display:grid; gap:var(--space-4);
  grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"top" "display" "listen" "tones"}
.tn-listen{grid-area:listen; display:flex}
.tn-listen .btn-tap{width:100%}
.btn-listen[aria-busy="true"] .tap-cap{color:var(--text-2)}
.note{display:inline-flex; align-items:baseline; font-size:clamp(88px,min(36cqi,19cqh),240px); font-weight:600; line-height:.92; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums; color:var(--text)}
.note-acc{font-size:.42em; align-self:flex-start; margin-top:.1em; letter-spacing:0}
.note-oct{font-size:.42em; letter-spacing:0; margin-left:.04em; color:var(--text-2)}
.note.is-empty{color:var(--text-3)}
.note.in-tune,.note.in-tune .note-oct{color:var(--accent-ink)}
/* Cents meter: +-50 cents = +-50% of rail width, so --c in % is cents */
.cents{width:100%; max-width:520px; display:flex; flex-direction:column; gap:6px; --c:0%; --fl:50%; --fw:0%}
.cents-track{position:relative; height:32px}
.cents-rail{position:absolute; left:0; right:0; top:10px; height:8px; border-radius:4px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.cents-zone{position:absolute; top:10px; height:8px; left:45%; width:10%; background:var(--accent-soft); box-shadow:inset 1px 0 0 var(--accent-line), inset -1px 0 0 var(--accent-line)}
.cents-ticks{position:absolute; left:0; right:0; top:22px; height:10px; display:flex; justify-content:space-between}
.cents-tick{width:2px; height:6px; border-radius:1px; background:var(--led-ring)}
.cents-tick.major{height:10px; background:var(--text-2)}
.cents-center{position:absolute; left:calc(50% - 1px); top:4px; width:2px; height:20px; border-radius:1px; background:var(--text-2)}
.cents-fill{position:absolute; top:10px; height:8px; border-radius:4px; left:var(--fl); width:var(--fw); background:var(--text-2); transition:left 80ms linear, width 80ms linear}
.cents-marker{position:absolute; top:4px; left:calc(50% + var(--c)); width:20px; height:20px; margin-left:-10px; border-radius:50%; background:var(--text);
  box-shadow:0 0 0 3px var(--bg); transition:left 80ms linear}
.cents.at-rest .cents-fill,.cents.at-rest .cents-marker{visibility:hidden}
.cents.in-tune .cents-fill{background:var(--accent)}
.cents.in-tune .cents-marker{background:var(--accent); box-shadow:inset 0 0 0 2.5px var(--accent-ring), 0 0 0 3px var(--bg)}
.cents-labels{display:flex; justify-content:space-between; font-size:13px; font-weight:600; color:var(--text-3); font-variant-numeric:tabular-nums}
/* Status: reserves 2 lines so a message change never shifts the layout */
.tn-status{display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; min-height:68px; width:100%; max-width:30em; text-align:center}
.tn-msg{margin:0; display:flex; align-items:flex-start; justify-content:center; gap:var(--space-2); font-size:16px; font-weight:600; line-height:1.35; color:var(--text); text-wrap:balance}
.tn-msg.muted{color:var(--text-2)}
.tn-msg > svg{flex:none; margin-top:1px; color:var(--text-2)}
.tn-reading{align-items:baseline}
.tn-num{font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; min-width:4ch; text-align:right}
.tn-word{font-size:16px; font-weight:600; color:var(--text-2)}
.tn-reading.in-tune .tn-num,.tn-reading.in-tune .tn-word{color:var(--accent-ink)}
.tn-cap{font-size:13px; font-weight:500; color:var(--text-3); font-variant-numeric:tabular-nums}
/* Reference tone generator */
.tn-tones{grid-area:tones; display:flex; flex-direction:column; gap:var(--space-2); min-width:0}
.tn-tones-head{display:flex; padding-left:var(--space-1)}
.tn-tones-title{font-size:13px; font-weight:600; color:var(--text-3)}
.seg-tones{grid-auto-flow:row; grid-auto-columns:auto; grid-template-columns:repeat(4,minmax(0,1fr))}
.seg-tones.is-expanded{grid-template-columns:repeat(6,minmax(0,1fr))}
.seg-tones .seg-btn{padding:0 2px; white-space:nowrap}
.tone-toggle{align-self:center; box-shadow:inset 0 0 0 1px var(--line)}
.tone-toggle svg{transition:transform 200ms cubic-bezier(.2,.8,.2,1)}
.tone-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
@container mt (orientation: landscape){
  .tn-inner{--action-h:64px; padding:var(--space-4) var(--space-5); column-gap:var(--space-5); row-gap:var(--space-3);
    grid-template-columns:minmax(0,1.1fr) minmax(300px,1fr); grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"top listen" "display tones"}
  .tn-tones{align-self:end}
  .tn-tones-head{display:none}
  .tn-status{min-height:60px}
  .note{font-size:clamp(72px,min(17cqi,30cqh),240px)}
}
@container mt (orientation: landscape) and (min-height: 600px){
  .tn-inner{--action-h:88px; max-width:1180px; padding:var(--space-6) var(--space-7); column-gap:64px; row-gap:var(--space-4);
    grid-template-columns:minmax(0,1fr) minmax(360px,440px); grid-template-rows:auto minmax(0,1fr) auto auto minmax(0,1fr);
    grid-template-areas:"top top" "display ." "display listen" "display tones" "display ."}
  .tn-tones{align-self:start}
  .tn-tones-head{display:flex}
  .tn-status{min-height:68px}
  .note{font-size:clamp(72px,min(19cqi,30cqh),240px)}
}

/* ===== Settings sheet ===== */
.scrim{position:absolute; inset:0; z-index:10; border:0; padding:0; margin:0; background:var(--scrim); opacity:0; visibility:hidden; transition:opacity 200ms, visibility 0s 200ms; cursor:pointer}
.sheet{position:absolute; z-index:11; left:0; right:0; bottom:0; max-height:88%; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3);
  padding:var(--space-2) var(--space-4) var(--space-5); background:var(--surface); border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:0 -1px 0 var(--line);
  transform:translateY(100%); visibility:hidden; transition:transform 260ms cubic-bezier(.2,.8,.2,1), visibility 0s 260ms; --thumb-gap:var(--surface)}
.sheet-open .scrim{opacity:1; visibility:visible; transition:opacity 200ms}
.sheet-open .sheet{transform:none; visibility:visible; transition:transform 260ms cubic-bezier(.2,.8,.2,1)}
.sheet-grip{align-self:center; width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px 0}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding-left:var(--space-1)}
.sheet-title{margin:0; font-size:20px; font-weight:650}
.field{display:flex; flex-direction:column; gap:4px; padding:12px 16px 4px; background:var(--surface-2); border-radius:var(--r-md); --thumb-gap:var(--surface-2)}
.field.pad{padding-bottom:12px; gap:10px}
.field-row{display:flex; justify-content:space-between; align-items:baseline}
.field-label{font-size:16px; font-weight:600; color:var(--text)}
.val{font-size:15px; font-weight:600; color:var(--text-2); font-variant-numeric:tabular-nums}
.sheet-version{margin:8px 0 0; text-align:center; font-size:12px; color:var(--text-3)}

/* ===== Landscape (phone) ===== */
@container mt (orientation: landscape){
  .mt-inner{--step-h:48px; --action-h:64px; padding:var(--space-4) var(--space-5); column-gap:var(--space-5); row-gap:var(--space-3);
    grid-template-columns:minmax(0,1.1fr) minmax(300px,1fr); grid-template-rows:auto auto auto minmax(0,1fr);
    grid-template-areas:"top rhythm" "display rhythm" "display tempo" "display actions"}
  .actions{align-self:end}
  .seg-sub .seg-btn{min-height:var(--hit)}
  .sub-label{display:none}
  .display{gap:clamp(8px,3cqh,24px)}
  .bpm{font-size:clamp(72px,min(17cqi,30cqh),240px)}
  .leds{--led:clamp(18px,3.6cqi,40px)}
  .sheet{left:auto; top:0; width:min(400px,52%); max-height:none; border-radius:var(--r-xl) 0 0 var(--r-xl); box-shadow:-1px 0 0 var(--line); transform:translateX(100%); padding-top:var(--space-4)}
  .sheet-grip{display:none}
}
/* ===== Desktop / tablet (landscape, tall) ===== */
@container mt (orientation: landscape) and (min-height: 600px){
  .mt-inner{--step-h:56px; --action-h:88px; max-width:1180px; padding:var(--space-6) var(--space-7); column-gap:64px; row-gap:var(--space-4);
    grid-template-columns:minmax(0,1fr) minmax(360px,440px); grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr);
    grid-template-areas:"top top" "display rhythm" "display tempo" "display actions"}
  .rhythm{align-self:end}
  .actions{align-self:start}
  .seg-sub .seg-btn{min-height:56px}
  .sub-label{display:block}
  .bpm{font-size:clamp(72px,min(19cqi,30cqh),240px)}
}
/* ===== Reduced motion: no flash or glow, fill change only ===== */
.rm .led,.rm .display,.rm .knob,.rm .switch,.rm .sheet,.rm .scrim,.rm .btn,.rm .bpm,.rm .tone-toggle svg,.rm .cents-fill,.rm .cents-marker{transition:none !important}
.rm .led.on{box-shadow:inset 0 0 0 2px var(--led-on)}
.rm .led-accent.on{box-shadow:inset 0 0 0 2.5px var(--accent-ring)}
.rm .display.flash,.rm .display.flash-accent{background-color:transparent}
.rm .btn:active,.rm .btn.is-pressed{transform:none}

var SCHEDULE_AHEAD_S = 0.1;
var audioCtx = null;
var nextNoteTime = 0, currentBeat = 0, currentSub = 0, noteIndex = 0;

var taps = [];

function scheduleAheadTime() { return document.hidden ? 1.0 : SCHEDULE_AHEAD_S; }

   occluded by another window, which stalls the scheduler entirely. A steady,
   effectively inaudible tone keeps the tab flagged as active audio so the

    keepAliveGain.gain.value = 0.0001;

    keepAliveOsc.start();

  try { keepAliveOsc.stop(); } catch (e) {}

  } catch (e) {}

/* Nodes already committed to the Web Audio graph keep playing on their own
   timeline even after stop() — stopScheduler() only prevents new ones from
   being scheduled. Track live nodes so Stop can silence anything still queued. */
var scheduledNodes = [];
function trackNode(node, endTime) {
  var now = audioCtx.currentTime;
  scheduledNodes = scheduledNodes.filter(function (e) { return e.endTime > now; });
  scheduledNodes.push({ node: node, endTime: endTime });
}
function stopAllScheduledNodes() {
  scheduledNodes.forEach(function (e) { try { e.node.stop(); } catch (err) {} });
  scheduledNodes = [];
}

function playSound(kind, time) {
  if (!audioCtx) return;
  try {
    var vol = state.volume / 100;
    var mult = kind === "accent" ? Math.min(1 + state.accentVolume / 100, 2) * 0.7
      : kind === "sub" ? 0.3 : kind === "sec" ? 0.6 : 0.5;
    var g = vol * mult;
    var gain = audioCtx.createGain();
    gain.connect(audioCtx.destination);
    if (state.sound === "hat") {
      var len = Math.floor(audioCtx.sampleRate * 0.05);
      var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = kind === "accent" ? 5000 : 7500;
      src.connect(hp); hp.connect(gain);
      gain.gain.setValueAtTime(g, time);
      src.start(time);
      trackNode(src, time + 0.05 + 0.05);
    } else {
      var wood = state.sound === "wood";
      var osc = audioCtx.createOscillator();
      osc.type = wood ? "sine" : "square";
      osc.frequency.value = wood
        ? (kind === "accent" ? 1250 : kind === "sub" ? 650 : 880)
        : (kind === "accent" ? 2000 : kind === "sub" ? 1000 : 1400);
      var dur = wood ? 0.07 : 0.03;
      osc.connect(gain);
      gain.gain.setValueAtTime(g * (wood ? 1 : 0.3), time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.start(time); osc.stop(time + dur + 0.02);
      trackNode(osc, time + dur + 0.02);
    }
  } catch (e) {}
}

function beatKind(beat, sub) {
  if (sub !== 0) return "sub";
  var m = meterById(state.meterId);
  if (beat === 0) return "accent";
  if (m.g.indexOf(beat) >= 0) return "sec";
  return "beat";
}

function scheduleNote(beat, sub, time) {
  playSound(beatKind(beat, sub), time);
  visualQueue.push({ time: time, beat: beat, sub: sub });
}

function advance() {
  var m = meterById(state.meterId);
  var subN = subdivById(state.subdivId).n;
  noteIndex++;
  currentSub++;
  if (currentSub >= subN) {
    currentSub = 0;
    if (pendingMeterReset) {
      currentBeat = 0; noteIndex = 0; pendingMeterReset = false;
    } else {
      currentBeat = (currentBeat + 1) % m.n;
    }
  }
  nextNoteTime += 60 / state.bpm / subN;
}

function schedulerTick() {
  var now = audioCtx.currentTime;
  /* If this tick itself fired late (background tab timer throttling), nextNoteTime
     can already be behind "now". Scheduling a note at a past time doesn't get dropped —
     Web Audio clamps it to fire immediately, which bunches up missed notes into one
     burst instead of spacing them out. Silently fast-forward through anything already
     in the past before scheduling anything new. */
  while (nextNoteTime < now) advance();
  while (nextNoteTime < now + scheduleAheadTime()) {
    scheduleNote(currentBeat, currentSub, nextNoteTime);
    advance();
  }
  schedulerTimerId = setTimeout(schedulerTick, LOOKAHEAD_INTERVAL_MS);
}

function startScheduler() {
  clearTimeout(schedulerTimerId);
  nextNoteTime = audioCtx.currentTime + 0.05;
  currentBeat = 0; currentSub = 0; noteIndex = 0; pendingMeterReset = false;
  visualQueue = [];
  schedulerTick();
}
function stopScheduler() { clearTimeout(schedulerTimerId); schedulerTimerId = null; visualQueue = []; }

/* ===== Vibration ===== */
var CAN_VIBRATE = "vibrate" in navigator;
function vibrateFor(beat) {
  if (IS_IOS || !state.vibrationEnabled || !CAN_VIBRATE) return;

}

    }).catch(function () {});

}

/* ===== Tuner: reference tone generator (two octaves, C3..B4) =====
   Ported from the Claude Design tuner prototype (same canvas as the metronome's
   own design) — see DECISIONS.md in the project's Obsidian vault for the source
   link and rationale (not part of this repo). */
var NOTE_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
var TUNER_BASE_MIDI = 48; // C3
var TUNER_NOTE_COUNT = 24;
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function midiToName(m) { return NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }
var TONE_FREQS = [];
for (var toneI = 0; toneI < TUNER_NOTE_COUNT; toneI++) TONE_FREQS.push(midiToFreq(TUNER_BASE_MIDI + toneI));

var toneOsc = null, toneGain = null, toneActiveIndex = -1;
function stopTone() {
  if (!toneOsc) return;
  var osc = toneOsc, gain = toneGain, now = audioCtx.currentTime;
  try {
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.04);
    osc.stop(now + 0.05);
  } catch (e) {}
  toneOsc = null; toneGain = null;
  toneActiveIndex = -1;
}
function playTone(index) {
  ensureAudio();
  if (!audioCtx) return;
  if (state.isPlaying) stop();
  stopDetection();
  stopTone();
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  var now = audioCtx.currentTime;
  osc.type = "sine";
  osc.frequency.value = TONE_FREQS[index];
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.25, now + 0.02);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  toneOsc = osc; toneGain = gain; toneActiveIndex = index;
  renderTuner();
}
function toggleTone(index) {
  if (toneActiveIndex === index) stopTone();
  else playTone(index);
  renderTuner();
}

/* ===== Tuner: microphone pitch detection =====
   Autocorrelation with parabolic interpolation, ported from the same design
   prototype: narrow the buffer to the region between the first near-zero
   crossing from each end (reduces edge artifacts in the correlation rather
   than stripping silence — a buffer that's already quiet at sample 0 leaves
   this a no-op, which is fine, there's nothing to narrow), correlate that
   window across its full range (no fixed Hz bounds), skip the initial
   downslope before hunting for the correlation peak (avoids the trivial lag-0
   maximum), then parabolic-interpolate around that peak. */
var MIC_SUPPORTED = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
var micStream = null, micSource = null, micAnalyser = null, micRafId = null, micDetectBuf = null, micRequestId = 0;
var tunerState = "idle"; // idle | pending | listening | detect | denied
var tunerMidi = 69, tunerCents = 0, tunerFreq = 440;
var tunerSmooth = null; // {m, c} — exponential smoothing while the same note is held
var tunerLastValidTime = 0;
var tunerLastPaint = 0;
var tunerLastAnnouncedMidi = null;
var DETECT_REPAINT_MS = 60, DETECT_RMS_GATE = 0.01, DETECT_TRIM_THRESHOLD = 0.2, DETECT_RELEASE_MS = 1500;

function acf(buf, sampleRate) {
  var size = buf.length, i, j, rms = 0;
  for (i = 0; i < size; i++) rms += buf[i] * buf[i];
  if (Math.sqrt(rms / size) < DETECT_RMS_GATE) return -1;

  var r1 = 0, r2 = size - 1;
  for (i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < DETECT_TRIM_THRESHOLD) { r1 = i; break; }
  for (i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < DETECT_TRIM_THRESHOLD) { r2 = size - i; break; }
  var b = buf.slice(r1, r2);
  var n = b.length;
  var c = new Float32Array(n);
  for (i = 0; i < n; i++) for (j = 0; j < n - i; j++) c[i] += b[j] * b[j + i];

  var d = 0;
  while (d < n - 1 && c[d] > c[d + 1]) d++;
  var mx = -1, mp = -1;
  for (i = d; i < n; i++) if (c[i] > mx) { mx = c[i]; mp = i; }
  if (mp <= 0 || mp >= n - 1) return -1;

  var x1 = c[mp - 1], x2 = c[mp], x3 = c[mp + 1];
  var a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
  return sampleRate / (a ? mp - bb / (2 * a) : mp);
}

function detectLoop() {
  if (!micAnalyser) return;
  micRafId = requestAnimationFrame(detectLoop);
  var now = performance.now();
  if (now - tunerLastPaint < DETECT_REPAINT_MS) return; // throttle the analysis itself, not just the repaint
  tunerLastPaint = now;
  if (!micDetectBuf || micDetectBuf.length !== micAnalyser.fftSize) micDetectBuf = new Float32Array(micAnalyser.fftSize);
  micAnalyser.getFloatTimeDomainData(micDetectBuf);
  var freq = acf(micDetectBuf, audioCtx.sampleRate);
  if (freq > 0) {
    var n = 12 * Math.log2(freq / 440) + 69;
    var m = Math.round(n);
    var c = (n - m) * 100;
    if (tunerSmooth && tunerSmooth.m === m) c = tunerSmooth.c * 0.7 + c * 0.3;
    tunerSmooth = { m: m, c: c };
    tunerLastValidTime = now;
    tunerMidi = m; tunerCents = Math.round(c); tunerFreq = freq;
    tunerState = "detect";
    renderTuner();
  } else if (tunerLastValidTime && now - tunerLastValidTime > DETECT_RELEASE_MS && tunerState === "detect") {
    tunerSmooth = null;
    tunerState = "listening";
    renderTuner();
  }
}

function startDetection() {
  if (!MIC_SUPPORTED || micStream) return;
  if (state.isPlaying) stop();
  stopTone();
  tunerState = "pending";
  renderTuner();
  ensureAudio();
  var requestId = ++micRequestId;
  navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  }).then(function (stream) {
    // The user may have left Tuner mode (or re-toggled Listen) while the permission
    // prompt was pending — stopDetection() bumps micRequestId to invalidate this.
    if (requestId !== micRequestId) {
      stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      return;
    }
    micStream = stream;
    ensureAudio();
    micSource = audioCtx.createMediaStreamSource(stream);
    micAnalyser = audioCtx.createAnalyser();
    micAnalyser.fftSize = 2048;
    micSource.connect(micAnalyser);
    tunerSmooth = null;
    tunerLastValidTime = 0;
    tunerState = "listening";
    detectLoop();
    renderTuner();
  }).catch(function () {
    if (requestId !== micRequestId) return;
    tunerState = "denied";
    renderTuner();
  });
}
function stopDetection() {
  micRequestId++; // invalidate any in-flight getUserMedia request from startDetection()
  if (micRafId) { cancelAnimationFrame(micRafId); micRafId = null; }
  if (micStream) { micStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); micStream = null; }
  if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
  micAnalyser = null;
  tunerSmooth = null;
  if (tunerState === "listening" || tunerState === "detect" || tunerState === "pending") tunerState = "idle";
  renderTuner();
}
function toggleListen() {
  if (tunerState === "listening" || tunerState === "detect") { stopDetection(); return; }
  if (tunerState === "pending") return;
  startDetection();
}

/* ===== Visuals: LED cache + rAF loop ===== */
var ledEls = [], pipEls = [], currentLit = -1, flashTimer = null;
function buildLeds() {
  var m = meterById(state.meterId);
  var subN = subdivById(state.subdivId).n;
  var leds = document.getElementById("leds");
  leds.innerHTML = "";
  ledEls = []; pipEls = [];
  for (var b = 0; b < m.n; b++) {
    var isGroupStart = m.g.indexOf(b) >= 0;
    var cell = document.createElement("div");
    cell.className = "beat" + (isGroupStart ? " group-start" : "");
    var led = document.createElement("span");
    led.className = "led" + (b === 0 ? " led-accent" : "") + (isGroupStart ? " led-sec" : "");
    cell.appendChild(led);
    var pipsWrap = document.createElement("span");
    pipsWrap.className = "pips";
    var rowPips = [];
    if (subN > 1) {
      for (var k = 0; k < subN; k++) {
        var pip = document.createElement("span");
        pip.className = "pip";
        pipsWrap.appendChild(pip);
        rowPips.push(pip);
      }
    }
    cell.appendChild(pipsWrap);
    leds.appendChild(cell);
    ledEls.push(led);
    pipEls.push(rowPips);
  }
  currentLit = -1;
}

var displayEl = document.getElementById("display");
function lightBeat(beat, sub) {
  if (sub === 0) {
    if (currentLit >= 0 && ledEls[currentLit]) ledEls[currentLit].classList.remove("on");
    currentLit = beat;
    if (ledEls[beat]) ledEls[beat].classList.add("on");
    var isAccentBeat = beat === 0;
    displayEl.classList.add(isAccentBeat ? "flash-accent" : "flash");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { displayEl.classList.remove("flash", "flash-accent"); }, 110);
    vibrateFor(beat);
  }
  if (pipEls[beat]) {
    pipEls[beat].forEach(function (p, i) { p.classList.toggle("on", i === sub); });
  }
}

function drawLoop() {
  if (audioCtx) {
    var now = audioCtx.currentTime;
    while (visualQueue.length && visualQueue[0].time <= now) {
      var entry = visualQueue.shift();
      lightBeat(entry.beat, entry.sub);
    }

}

/* ===== Tap tempo ===== */
function tap() {
  var now = Date.now();
  var last = taps[taps.length - 1];
  if (last && now - last > 2000) taps = [];
  taps.push(now);
  if (taps.length > 6) taps.shift();
  if (taps.length >= 2) {
    var avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
    state.bpm = clampBpm(60000 / avg);
    scheduleSave();
  }
  state.tapping = true;
  state.tapCount = taps.length;
  clearTimeout(tapResetTimer);
  tapResetTimer = setTimeout(function () { taps = []; state.tapping = false; state.tapCount = 0; render(); }, 2000);
  render();
}

  btnMinus1.disabled = state.bpm <= 30;
  btnPlus1.disabled = state.bpm >= 240;
  btnPlus5.disabled = state.bpm >= 240;

  if (state.tapping) {
    tempoNameEl.textContent = (state.tapCount >= 2) ? T.tapSubtitleMore : T.tapSubtitleFirst;
    tapCapEl.textContent = T.tapCountPlural(state.tapCount);
  } else {
    tempoNameEl.textContent = tempoName(state.bpm);
    tapCapEl.textContent = T.tapCaptionIdle;
  }
  btnTap.classList.toggle("is-active", !!state.tapping);

  btnToggle.classList.toggle("is-active", state.isPlaying);
  btnToggle.setAttribute("aria-pressed", state.isPlaying ? "true" : "false");
  iconPlay.hidden = state.isPlaying;
  iconStop.hidden = !state.isPlaying;
  toggleLabel.textContent = state.isPlaying ? T.stop : T.start;

  btnSettingsEls.forEach(function (btn) { btn.setAttribute("aria-expanded", state.settingsOpen ? "true" : "false"); });
  app.classList.toggle("sheet-open", !!state.settingsOpen);
  sheet.setAttribute("aria-hidden", state.settingsOpen ? "false" : "true");

  var showHint = IS_IOS && state.isPlaying && !state.hintDismissed;
  hintEl.hidden = !showHint;

  volSlider.value = state.volume;
  volSlider.style.setProperty("--fill", state.volume + "%");
  volVal.textContent = state.volume + "%";
  accSlider.value = state.accentVolume;
  accSlider.style.setProperty("--fill", state.accentVolume + "%");
  accVal.textContent = "+" + state.accentVolume + "%";

  rowVibe.hidden = IS_IOS;
  rowVibe.setAttribute("aria-checked", state.vibrationEnabled ? "true" : "false");
  rowWake.setAttribute("aria-checked", state.wakeLockEnabled ? "true" : "false");

  Array.prototype.forEach.call(segMeter.children, function (btn, i) {
    btn.setAttribute("aria-pressed", METERS[i].id === state.meterId ? "true" : "false");
  });
  Array.prototype.forEach.call(segSub.children, function (btn, i) {
    btn.setAttribute("aria-pressed", SUBDIVS[i].id === state.subdivId ? "true" : "false");
  });
  Array.prototype.forEach.call(segSound.children, function (btn, i) {
    btn.setAttribute("aria-pressed", SOUNDS[i] === state.sound ? "true" : "false");
  });
  var themeId = state.theme === "light" ? "light" : state.theme === "dark" ? "dark" : "auto";
  Array.prototype.forEach.call(segTheme.children, function (btn, i) {
    btn.setAttribute("aria-pressed", THEMES[i] === themeId ? "true" : "false");
  });

  mtInner.hidden = state.mode === "tuner";
  tnInner.hidden = state.mode !== "tuner";
  segModeEls.forEach(function (seg) {
    Array.prototype.forEach.call(seg.children, function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-mode") === state.mode ? "true" : "false");
    });
  });
}

function renderTuner() {
  var det = tunerState === "detect";
  var cents = Math.max(-50, Math.min(50, tunerCents));
  var inTune = det && Math.abs(cents) <= 5;
  var fullName = NOTE_NAMES[((tunerMidi % 12) + 12) % 12];
  var letter = fullName.charAt(0);
  var isSharp = fullName.length > 1;
  var octave = Math.floor(tunerMidi / 12) - 1;

  tunerNoteEl.classList.toggle("is-empty", !det);
  tunerNoteEl.classList.toggle("in-tune", inTune);
  tunerNoteEmptyEl.hidden = det;
  tunerNoteContentEl.hidden = !det;
  if (det) {
    tunerNoteLetterEl.textContent = letter;
    tunerNoteAccEl.hidden = !isSharp;
    tunerNoteOctEl.textContent = octave;
  }
  var noteLabel = det ? (letter + (isSharp ? "♯" : "") + octave) : T.tunerNoNote;
  tunerNoteEl.setAttribute("aria-label", noteLabel);
  /* Only push into the shared announcer when the note identity changes, not on every
     cents refinement of the same held note — a continuous aria-live region here would
     re-announce up to ~16 times/second while a note is held (see DECISIONS.md). */
  var identity = det ? tunerMidi : null;
  if (identity !== tunerLastAnnouncedMidi) {
    tunerLastAnnouncedMidi = identity;
    if (det && state.mode === "tuner") announcer.textContent = noteLabel;
  }

  tunerCentsEl.classList.toggle("at-rest", !det);
  tunerCentsEl.classList.toggle("in-tune", inTune);
  tunerCentsEl.style.setProperty("--c", cents + "%");
  tunerCentsEl.style.setProperty("--fl", (cents < 0 ? 50 + cents : 50) + "%");
  tunerCentsEl.style.setProperty("--fw", Math.abs(cents) + "%");
  tunerCentsEl.setAttribute("aria-valuenow", det ? cents : 0);

  tunerMsgEl.hidden = det;
  tunerReadingEl.hidden = !det;
  if (det) {
    var sign = cents > 0 ? "+" : cents < 0 ? "−" : "±";
    tunerNumEl.textContent = sign + Math.abs(cents) + " ¢";
    tunerWordEl.textContent = "· " + (inTune ? T.tunerInTune : cents < 0 ? T.tunerFlat : T.tunerSharp);
    tunerReadingEl.classList.toggle("in-tune", inTune);
  } else {
    tunerMsgIconEl.hidden = !(tunerState === "pending" || tunerState === "denied");
    tunerMsgIconSlashEl.hidden = tunerState !== "denied";
    tunerMsgTextEl.textContent = tunerState === "pending" ? T.tunerMicPending
      : tunerState === "denied" ? T.tunerMicDenied
      : tunerState === "listening" ? T.tunerListening
      : (MIC_SUPPORTED ? T.tunerStatusIdle : T.tunerStatusIdleNoMic);
  }
  tunerCapEl.textContent = det
    ? tunerFreq.toFixed(1).replace(".", T.decimalSeparator) + " Hz"
    : T.tunerRefPitchCap;

  var active = tunerState === "listening" || det;
  btnMicToggle.classList.toggle("is-active", active);
  btnMicToggle.setAttribute("aria-pressed", active ? "true" : "false");
  btnMicToggle.setAttribute("aria-busy", tunerState === "pending" ? "true" : "false");
  listenLabelEl.textContent = active ? T.stop : T.tunerListenLabel;
  listenCapEl.textContent = active ? T.tunerCapListening
    : tunerState === "pending" ? T.tunerCapPending
    : tunerState === "denied" ? T.tunerCapDenied
    : T.tunerCapIdle;

  Array.prototype.forEach.call(toneGrid.children, function (btn, i) {
    btn.setAttribute("aria-pressed", i === toneActiveIndex ? "true" : "false");
  });
}

/* ===== Events ===== */
btnToggle.addEventListener("click", toggle);
btnTap.addEventListener("click", tap);
bpmSlider.addEventListener("input", function (e) { setBpm(e.target.value); });
btnMinus5.addEventListener("click", function () { setBpm(state.bpm - 5); });
btnMinus1.addEventListener("click", function () { setBpm(state.bpm - 1); });
btnPlus1.addEventListener("click", function () { setBpm(state.bpm + 1); });
btnPlus5.addEventListener("click", function () { setBpm(state.bpm + 5); });

btnSettingsEls.forEach(function (btn) { btn.addEventListener("click", openSettings); });
document.getElementById("btn-close-settings").addEventListener("click", closeSettings);
document.getElementById("btn-scrim").addEventListener("click", closeSettings);
document.getElementById("btn-close-hint").addEventListener("click", function () { state.hintDismissed = true; render(); });

volSlider.addEventListener("input", function (e) { state.volume = Number(e.target.value); scheduleSave(); render(); });
accSlider.addEventListener("input", function (e) { state.accentVolume = Number(e.target.value); scheduleSave(); render(); });
rowVibe.addEventListener("click", function () { state.vibrationEnabled = !state.vibrationEnabled; scheduleSave(); render(); });
rowWake.addEventListener("click", function () {
  state.wakeLockEnabled = !state.wakeLockEnabled;
  scheduleSave();
  if (!state.wakeLockEnabled) releaseWakeLock(); else if (state.isPlaying) requestWakeLock();
  render();
});

document.addEventListener("keydown", function (e) {
  var tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.code === "Escape") { if (state.settingsOpen) closeSettings(); return; }
  if (state.mode === "tuner") return;
  if (e.code === "Space") { e.preventDefault(); toggle(); return; }
  if (e.code === "ArrowUp") { e.preventDefault(); setBpm(state.bpm + 1); return; }
  if (e.code === "ArrowDown") { e.preventDefault(); setBpm(state.bpm - 1); return; }
  if (e.code === "ArrowRight") { e.preventDefault(); setBpm(state.bpm + 10); return; }
  if (e.code === "ArrowLeft") { e.preventDefault(); setBpm(state.bpm - 10); return; }
  if (e.key === "t" || e.key === "T") { tap(); return; }
});

/* ===== Translate static markup ===== */
function translateStaticMarkup() {
  if (LOCALE === "en") return;
  document.title = T.brand;
  document.getElementById("meta-description").setAttribute("content", T.metaDescription);
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    var key = el.getAttribute("data-i18n");
    if (T[key] !== undefined) el.textContent = T[key];
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
    var key = el.getAttribute("data-i18n-aria");
    if (T[key] !== undefined) el.setAttribute("aria-label", T[key]);
  });
}

/* ===== PWA: register the service worker ===== */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}

/* ===== Initialization ===== */
translateStaticMarkup();
applyTheme();
applyReducedMotion();
buildLeds();
document.getElementById("btn-mic-toggle").hidden = !MIC_SUPPORTED;
render();
renderTuner();
</script>
</body>
</html>
